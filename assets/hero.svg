<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec3f4"/>
      <stop offset=".55" stop-color="#ffd59e"/>
      <stop offset="1" stop-color="#ffb57a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ad96b"/><stop offset="1" stop-color="#5fb34a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc95a"/><stop offset="1" stop-color="#3f9a3c"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe9d2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#sky)"/>

  <!-- sole sorridente -->
  <g transform="translate(1010 105)">
    <circle r="150" fill="url(#glow)"/>
    <g stroke="#ffc21a" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="-92" x2="0" y2="-118"/><line x1="0" y1="92" x2="0" y2="118"/>
      <line x1="-92" y1="0" x2="-118" y2="0"/><line x1="92" y1="0" x2="118" y2="0"/>
      <line x1="65" y1="65" x2="84" y2="84"/><line x1="-65" y1="-65" x2="-84" y2="-84"/>
      <line x1="65" y1="-65" x2="84" y2="-84"/><line x1="-65" y1="65" x2="-84" y2="84"/>
    </g>
    <circle r="72" fill="#ffd93b" stroke="#ffb703" stroke-width="5"/>
    <ellipse cx="-24" cy="-12" rx="7" ry="10" fill="#5a3a12"/>
    <ellipse cx="24" cy="-12" rx="7" ry="10" fill="#5a3a12"/>
    <circle cx="-42" cy="12" r="10" fill="#ff9a76" opacity=".7"/>
    <circle cx="42" cy="12" r="10" fill="#ff9a76" opacity=".7"/>
    <path d="M-30 14 Q0 46 30 14" fill="none" stroke="#5a3a12" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- nuvolette -->
  <g fill="#fff" opacity=".9">
    <g transform="translate(560 70)"><ellipse rx="46" ry="18"/><ellipse cx="-30" cy="6" rx="28" ry="14"/><ellipse cx="26" cy="-10" rx="26" ry="18"/></g>
    <g transform="translate(800 40) scale(.7)"><ellipse rx="46" ry="18"/><ellipse cx="-30" cy="6" rx="28" ry="14"/><ellipse cx="26" cy="-10" rx="26" ry="18"/></g>
  </g>

  <!-- colline -->
  <path d="M0 240 C200 180 380 210 560 235 S900 190 1200 225 V300 H0Z" fill="url(#hill1)"/>
  <path d="M0 270 C260 230 520 260 760 268 S1050 240 1200 255 V300 H0Z" fill="url(#hill2)"/>
  <g fill="#fff59d"><circle cx="640" cy="262" r="5"/><circle cx="700" cy="276" r="4"/><circle cx="880" cy="258" r="5"/><circle cx="420" cy="280" r="4"/></g>
  <g fill="#ff8fab"><circle cx="660" cy="281" r="4"/><circle cx="920" cy="272" r="4"/><circle cx="460" cy="266" r="5"/></g>

  <!-- tazza di caffè sorridente -->
  <g transform="translate(770 262) scale(.55)">
    <path d="M-20 -150 C-40 -175 0 -190 -20 -215" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/>
    <path d="M20 -150 C0 -175 40 -190 20 -215" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="0" cy="18" rx="120" ry="20" fill="#c97b4a"/>
    <path d="M-80 -130 H80 L68 0 Q0 22 -68 0Z" fill="url(#cup)" stroke="#c97b4a" stroke-width="6"/>
    <path d="M78 -105 C130 -105 130 -35 70 -35" fill="none" stroke="#c97b4a" stroke-width="12"/>
    <ellipse cx="0" cy="-130" rx="80" ry="12" fill="#7a4521"/>
    <circle cx="-25" cy="-80" r="7" fill="#5a3a12"/><circle cx="25" cy="-80" r="7" fill="#5a3a12"/>
    <path d="M-22 -58 Q0 -36 22 -58" fill="none" stroke="#5a3a12" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-45" cy="-62" r="8" fill="#ff9a76" opacity=".6"/><circle cx="45" cy="-62" r="8" fill="#ff9a76" opacity=".6"/>
  </g>
</svg>
