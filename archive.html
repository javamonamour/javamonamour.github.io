---
layout: default
title: Archive
---
<h1>Archive</h1>
{% for p in site.posts %}{% assign y = p.date | date: "%Y" %}{% if y != prev %}{% unless forloop.first %}</ul>{% endunless %}<h2>{{ y }}</h2><ul class="list">{% assign prev = y %}{% endif %}<li><span class="date">{{ p.date | date: "%m-%d" }}</span> <a href="{{ p.url }}">{{ p.title }}</a></li>{% endfor %}</ul>
