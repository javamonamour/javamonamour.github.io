title: Java mon amour
description: "Pierre's blog: Java, WebLogic, OSB, Docker, Kubernetes and more"
url: https://javamonamour.github.io
baseurl: ""
timezone: Europe/Rome
permalink: /:year/:month/:title.html
paginate: 20
paginate_path: /page/:num/
plugins:
